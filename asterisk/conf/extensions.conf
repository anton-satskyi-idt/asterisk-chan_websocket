[general]
static = yes
writeprotect = yes

[internal]
; Echo test through the Go service over chan_websocket.
; c(ulaw) = media codec, f(json) = JSON control messages (plain text is deprecated).
; DTMF 0 makes the Go service send TRANSFER, moving the caller to 601 (chan_websocket.conf).
exten => 600,1,NoOp(WebSocket echo test)
 same => n,Answer()
 same => n,Dial(WebSocket/go_echo/c(ulaw)f(json))
 same => n,Hangup()

; Phoneless smoke test: plays a prompt into the echo service, then hangs up.
;   asterisk -rx "channel originate Local/600@internal extension play@smoke"
[smoke]
exten => play,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Wait(1)
 same => n,Hangup()

; Phoneless transfer test: talks to 600, presses 0 after 3 s, then plays a prompt into 601's Echo().
;   asterisk -rx "channel originate Local/600@internal extension xfer@smoke"
exten => xfer,1,Answer()
 same => n,Wait(3)
 same => n,SendDTMF(0)
 same => n,Playback(demo-congrats)
 same => n,Hangup()

[internal]
; Transfer target: plays demo-congrats (so you hear the transfer happened), then Asterisk's built-in echo.
exten => 601,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Echo()
 same => n,Hangup()
