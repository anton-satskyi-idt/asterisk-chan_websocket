[general]
static = yes
writeprotect = yes

[internal]
; Echo test through the Go service over chan_websocket.
; c(ulaw) = media codec, f(json) = JSON control messages (plain text is deprecated).
; DTMF 0 makes the Go service send TRANSFER, moving the caller to 601 (chan_websocket.conf).
exten => 600,1,NoOp(WebSocket echo test)
 same => n,Answer()
 same => n,Dial(WebSocket/go_echo/c(ulaw)f(json))
 same => n,Hangup()

; Phoneless smoke test: plays a prompt into the echo service, then hangs up.
;   asterisk -rx "channel originate Local/600@internal extension play@smoke"
[smoke]
exten => play,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Wait(1)
 same => n,Hangup()

; Phoneless transfer test: talks to 600, presses 0 after 3 s, then plays a prompt into 601's Echo().
;   asterisk -rx "channel originate Local/600@internal extension xfer@smoke"
exten => xfer,1,Answer()
 same => n,Wait(3)
 same => n,SendDTMF(0)
 same => n,Playback(demo-congrats)
 same => n,Hangup()

; Phoneless warm transfer tests: warm1..warm4 press that digit after 3 s (go-echo maps
; 1..4 to warm transfers to 601..604), then keep sending audio for 30 s.
;   asterisk -rx "channel originate Local/600@internal extension warm2@smoke"
exten => _warm[1-4],1,Answer()
 same => n,Wait(3)
 same => n,SendDTMF(${EXTEN:4})
 same => n,Playback(demo-congrats)
 same => n,Hangup()

[internal]
; Transfer targets. For a warm transfer they run on a Local channel, and only Answer()
; counts as the destination answering; the hang-up cause decides the failure status.
; 601: rings 3 s, answers, plays demo-congrats (so you hear the transfer happened), then echo.
exten => 601,1,Ringing()
 same => n,Wait(3)
 same => n,Answer()
 same => n,Playback(demo-congrats)
 same => n,Echo()

; 602: rings 3 s, then busy -> TRANSFER_RESULT busy (cause 17).
exten => 602,1,Ringing()
 same => n,Wait(3)
 same => n,Hangup(17)

; 603: rings forever -> TRANSFER_RESULT no_answer after the ring timeout.
exten => 603,1,Ringing()
 same => n,Wait(300)
 same => n,Hangup()

; 604: unreachable -> TRANSFER_RESULT unavailable (cause 1, unallocated number).
exten => 604,1,Hangup(1)
 same => n,Hangup()
