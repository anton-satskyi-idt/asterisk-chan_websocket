[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = ${EXTERNAL_IP}
external_signaling_address = ${EXTERNAL_IP}
; No local_net: with Docker/Podman port publishing, phone traffic arrives from a
; container-network address, so every peer must be treated as external.

; Softphone extension 1001 / password 1001
[1001]
type = endpoint
transport = transport-udp
context = internal
disallow = all
allow = ulaw
auth = 1001
aors = 1001
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[1001]
type = auth
auth_type = userpass
username = 1001
password = 1001

[1001]
type = aor
max_contacts = 1
remove_existing = yes
