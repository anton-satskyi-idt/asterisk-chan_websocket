; chan_websocket global options (n2p-asterisk websocket-transfer patch).
; Lets the app move the caller with
;   {"command":"TRANSFER","correlation_id":"...","exten":"601","context":"internal"}
[global]
type = global
control_message_format = json
transfer_enabled = yes
transfer_contexts = internal
transfer_default_context = internal
; Warm: "type":"warm" dials Local/exten@context/n while the caller stays with the app;
; busy / no answer / unavailable come back as TRANSFER_RESULT and the caller stays.
transfer_warm_enabled = yes
transfer_max_ring_timeout = 60
transfer_hold_class = default
